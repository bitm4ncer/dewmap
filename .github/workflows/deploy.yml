name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_run:
    workflows: ["History data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute Pages URLs
        env:
          CUSTOM_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          CUSTOM_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ -n "$CUSTOM_SITE_URL" ]; then
            # A custom domain is served from the root, so it has no base path.
            SITE_URL="$CUSTOM_SITE_URL"
            DEFAULT_BASE_PATH=""
          else
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
            DEFAULT_BASE_PATH="/${REPO_NAME}"
          fi
          BASE_PATH="${CUSTOM_BASE_PATH:-$DEFAULT_BASE_PATH}"
          echo "NEXT_PUBLIC_BASE_PATH=${BASE_PATH}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=${SITE_URL}" >> "$GITHUB_ENV"

      - name: Download latest history data
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release list --limit 50 --json tagName --jq '.[].tagName' | grep '^history-data-' | head -1 || true)"
          if [ -z "$TAG" ]; then
            echo "No history-data release found; deploying without the global dataset."
            exit 0
          fi
          mkdir -p /tmp/history-data
          gh release download "$TAG" --pattern 'history-data-*.tar.gz' --dir /tmp/history-data
          mkdir -p public/data/history
          tar -xzf /tmp/history-data/history-data-*.tar.gz -C public/data/history
          ls -lh public/data/history

      - name: Build static export
        run: npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
