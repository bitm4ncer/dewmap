name: History data

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe
          tippecanoe --version
          tippecanoe-decode --version || true

      - name: Build worldwide heritage data
        env:
          TIPPECANOE_BIN: tippecanoe
          TIPPECANOE_DECODE: tippecanoe-decode
        run: npm run history:build

      - name: Validate scripts
        run: npm run test:scripts

      - name: Package release asset
        id: package
        run: |
          BUILD_ID="$(node -p "require('./public/data/history/manifest.json').buildId")"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          tar -czf "history-data-${BUILD_ID}.tar.gz" -C public/data/history .
          ls -lh "history-data-${BUILD_ID}.tar.gz"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-data-${{ steps.package.outputs.build_id }}
          path: |
            public/data/history/manifest.json
            public/data/history/*/*.pmtiles
          retention-days: 30

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="history-data-${{ steps.package.outputs.build_id }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "history-data-${{ steps.package.outputs.build_id }}.tar.gz" --clobber
          else
            gh release create "$TAG" "history-data-${{ steps.package.outputs.build_id }}.tar.gz" \
              --title "History data ${{ steps.package.outputs.build_id }}" \
              --notes "Worldwide heritage PMTiles built from Wikidata. Generated by the History data workflow."
          fi
